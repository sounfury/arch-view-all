# Generated by ci/woodpecker/generate.py; edit quality/woodpecker.json.
when:
  -
    event:
      - "push"
      - "pull_request"
      - "manual"
steps:
  -
    name: "圈复杂度"
    image: "local/clojure-quality:1.0.0"
    when:
      -
        evaluate: "SKIP_CYCLOMATIC != \"true\" && CYCLOMATIC_NONBLOCK != \"true\""
    commands:
      - "crap complexity . --lang clojure --src src --fail-on-complexity 13 --top 50"
    pull: false
  -
    name: "圈复杂度（不阻断）"
    image: "local/clojure-quality:1.0.0"
    when:
      -
        evaluate: "SKIP_CYCLOMATIC != \"true\" && CYCLOMATIC_NONBLOCK == \"true\""
    commands:
      - "crap complexity . --lang clojure --src src --fail-on-complexity 13 --top 50"
    pull: false
    failure: "ignore"
