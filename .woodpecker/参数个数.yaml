# Generated by ci/woodpecker/generate.py; edit quality/woodpecker.json.
when:
  -
    event:
      - "push"
      - "pull_request"
      - "manual"
steps:
  -
    name: "参数个数"
    image: "local/clojure-quality:1.0.0"
    when:
      -
        evaluate: "SKIP_PARAMS != \"true\" && PARAMS_NONBLOCK != \"true\""
    commands:
      - "clojure-quality params 5 \"$PWD\" src"
    pull: false
  -
    name: "参数个数（不阻断）"
    image: "local/clojure-quality:1.0.0"
    when:
      -
        evaluate: "SKIP_PARAMS != \"true\" && PARAMS_NONBLOCK == \"true\""
    commands:
      - "clojure-quality params 5 \"$PWD\" src"
    pull: false
    failure: "ignore"
