# Generated by ci/woodpecker/generate.py; edit quality/woodpecker.json.
when:
  -
    event:
      - "push"
      - "pull_request"
      - "manual"
steps:
  -
    name: "重复代码"
    image: "node:22-bookworm-slim"
    when:
      -
        evaluate: "SKIP_DUPLICATION != \"true\" && DUPLICATION_NONBLOCK != \"true\""
    commands:
      - "npm install --global jscpd@5.4.1"
      - "jscpd src java --config quality/jscpd.json --no-colors --no-tips"
  -
    name: "重复代码（不阻断）"
    image: "node:22-bookworm-slim"
    when:
      -
        evaluate: "SKIP_DUPLICATION != \"true\" && DUPLICATION_NONBLOCK == \"true\""
    commands:
      - "npm install --global jscpd@5.4.1"
      - "jscpd src java --config quality/jscpd.json --no-colors --no-tips"
    failure: "ignore"
