# Generated by ci/woodpecker/generate.py; edit quality/woodpecker.json.
when:
  -
    event:
      - "push"
      - "pull_request"
      - "manual"
steps:
  -
    name: "文件行数"
    image: "local/clojure-quality:1.0.0"
    when:
      -
        evaluate: "SKIP_FILE_LENGTH != \"true\" && FILE_LENGTH_NONBLOCK != \"true\""
    commands:
      - "clojure-quality file-length 600 \"$PWD\" src"
    pull: false
  -
    name: "文件行数（不阻断）"
    image: "local/clojure-quality:1.0.0"
    when:
      -
        evaluate: "SKIP_FILE_LENGTH != \"true\" && FILE_LENGTH_NONBLOCK == \"true\""
    commands:
      - "clojure-quality file-length 600 \"$PWD\" src"
    pull: false
    failure: "ignore"
