when:
  -
    event:
      - "push"
      - "pull_request"
      - "manual"
steps:
  -
    name: "认知复杂度"
    image: "local/clojure-quality:1.0.0"
    when:
      -
        evaluate: "SKIP_COMPLEXITY != \"true\" && COMPLEXITY_NONBLOCK != \"true\""
    commands:
      - "clojure-quality cognitive 15 \"$PWD\" src"
