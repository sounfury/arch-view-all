<!-- 页面结构：定义项目概览、架构地图、模块详情和文档面板，是浏览器打开工作台时的页面入口。 -->

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Arch View · 项目架构</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <script defer src="/vendor/marked.umd.js"></script>
  <script defer src="/vendor/purify.min.js"></script>
  <script defer src="/vendor/mermaid.min.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="icon-map" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="6" rx="1.5"/><rect x="2" y="16" width="6" height="6" rx="1.5"/><rect x="16" y="16" width="6" height="6" rx="1.5"/><path d="M12 8v4M5 16v-4h14v4"/></symbol>
    <symbol id="icon-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
    <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h5l3 3h6a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/><path d="M3 9h18"/></symbol>
    <symbol id="icon-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></symbol>
    <symbol id="icon-flow" viewBox="0 0 24 24"><rect x="2" y="8" width="6" height="8" rx="2"/><rect x="16" y="2" width="6" height="6" rx="2"/><rect x="16" y="16" width="6" height="6" rx="2"/><path d="M8 12h4V5h4M12 12v7h4"/></symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 7a9 9 0 1 0 1 8M20 3v5h-5"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="icon-return" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-4"/></symbol>
    <symbol id="icon-back" viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></symbol>
    <symbol id="icon-external" viewBox="0 0 24 24"><path d="M8 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3M13 3h8v8M21 3 10 14"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="icon-fit" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5"/><rect x="8" y="8" width="8" height="8" rx="1"/></symbol>
    <symbol id="icon-expand" viewBox="0 0 24 24"><path d="M8 3H3v5M3 3l6 6M16 3h5v5m0-5-6 6M21 16v5h-5m5 0-6-6M8 21H3v-5m0 5 6-6"/></symbol>
    <symbol id="icon-collapse" viewBox="0 0 24 24"><path d="M3 9h6V3M9 9 3 3M21 9h-6V3m0 6 6-6M15 21v-6h6m-6 0 6 6M9 21v-6H3m6 0-6 6"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="icon-eye-off" viewBox="0 0 24 24"><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-2.7 3.6M6.6 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18"/></symbol>
    <symbol id="icon-book" viewBox="0 0 24 24"><path d="M12 5c-3-2-6-2-10-1v15c4-1 7-1 10 1 3-2 6-2 10-1V4c-4-1-7-1-10 1Zm0 0v15"/></symbol>
  </defs></svg>
  <aside class="rail">
    <a class="brand" href="#" id="brand-home"><span class="brand-mark" aria-hidden="true" data-icon="map"></span><span>Arch View<small>项目架构工作台</small></span></a>
    <div class="project-label">当前项目</div>
    <div class="project-name" id="project-name">正在加载…</div>
    <div class="project-language" id="project-language"></div>
    <nav aria-label="主导航" class="main-nav">
      <button class="nav-button active" id="overview-nav"><span aria-hidden="true" data-icon="grid"></span> 项目总览</button>
      <button class="nav-button" id="explore-nav"><span aria-hidden="true" data-icon="map"></span> 模块探索</button>
    </nav>
    <div class="rail-section-title"><strong id="nav-title">模块导航</strong> <span id="root-count"></span></div>
    <div id="module-nav" class="module-nav"></div>
    <div class="rail-section-title docs-label">架构说明</div>
    <label class="sr-only" for="document-select">选择已有说明文档</label>
    <select id="document-select"><option value="">未选择说明文档</option></select>
    <button class="text-button document-open" id="document-open"><span class="inline-icon" aria-hidden="true" data-icon="book"></span>阅读完整说明<span aria-hidden="true" data-icon="external"></span></button>
    <div class="rail-bottom"><span class="status-dot"></span> 本机分析<span id="project-path" title="项目目录"></span></div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <nav id="breadcrumbs" class="breadcrumbs" aria-label="当前位置"></nav>
      <div class="topbar-actions"><span id="analysis-state" class="analysis-state">源码静态依赖</span><button id="reanalyze" class="button small"><span aria-hidden="true" data-icon="refresh"></span>重新分析</button></div>
    </header>
    <main>
      <section class="hero" id="hero">
        <div class="hero-content"><div class="eyebrow">项目概览 <span class="short-rule"></span><span class="hero-tag">从整体到细节</span></div>
          <h1 id="hero-title">项目架构</h1><p id="hero-summary">正在读取项目结构…</p>
          <button id="start-explore" class="button primary">探索模块 <span aria-hidden="true" data-icon="arrow"></span></button>
        </div>
        <div class="hero-diagram" aria-hidden="true"><svg viewBox="0 0 300 168" fill="none"><path class="blueprint-guide" d="M12 26h276M12 142h276M24 12v144M276 12v144"/><path class="blueprint-line" d="M150 57v21M63 101V78h174v23M150 78v23"/><rect class="blueprint-top" x="106" y="19" width="88" height="38" rx="9"/><rect class="blueprint-card" x="26" y="101" width="74" height="42" rx="8"/><rect class="blueprint-card" x="113" y="101" width="74" height="42" rx="8"/><rect class="blueprint-card" x="200" y="101" width="74" height="42" rx="8"/><circle class="blueprint-junction" cx="150" cy="78" r="4"/><text class="blueprint-title" x="150" y="43">项目</text><text class="blueprint-label" x="63" y="127">模块</text><text class="blueprint-label" x="150" y="127">职责</text><text class="blueprint-label" x="237" y="127">源码</text></svg><span class="blueprint-caption">一张图，理解项目全貌</span></div>
      </section>
      <section class="metrics" aria-label="项目规模">
        <div><span class="metric-icon" aria-hidden="true" data-icon="file"></span><span class="metric-value" id="metric-modules">—</span><span class="metric-label">源码模块</span></div>
        <div><span class="metric-icon" aria-hidden="true" data-icon="flow"></span><span class="metric-value" id="metric-edges">—</span><span class="metric-label">内部依赖</span></div>
        <div><span class="metric-icon" aria-hidden="true" data-icon="folder"></span><span class="metric-value" id="metric-groups">—</span><span class="metric-label">当前分组</span></div>
        <button id="cycle-filter" class="metric-cycle"><span class="metric-icon" aria-hidden="true" data-icon="refresh"></span><span class="metric-value" id="metric-cycles">—</span><span class="metric-label">循环依赖组</span></button>
      </section>
      <section id="architecture-coverage" class="architecture-coverage" aria-label="架构文档覆盖提示" hidden></section>
      <div class="view-grid">
        <section class="map-panel">
          <div class="panel-heading"><div><div class="eyebrow">架构地图</div><h2 id="map-title">全局架构地图</h2></div>
            <div class="map-tools"><button class="icon-button" id="map-back" aria-label="返回上一级" title="返回上一级" disabled data-icon="back"></button><button class="return-button" id="map-return" hidden></button><button class="icon-button" id="zoom-out" aria-label="缩小" data-icon="minus"></button><span id="zoom-value">100%</span><button class="icon-button" id="zoom-in" aria-label="放大" data-icon="plus"></button><button class="icon-button fit-button" id="zoom-fit" aria-label="居中图" title="缩放适应画布并居中" data-icon="fit"></button><button class="icon-button" id="map-fullscreen" aria-label="全屏查看" title="全屏查看" aria-pressed="false" data-icon="expand"></button></div>
          </div>
          <div class="map-kind-row"><div class="map-kind" role="group" aria-label="架构图类型"><button id="code-view" class="active" aria-pressed="true"><span aria-hidden="true" data-icon="map"></span>代码依赖</button><button id="flow-view" aria-pressed="false" disabled><span aria-hidden="true" data-icon="flow"></span>文档数据流</button></div><label class="sr-only" for="flow-select">选择数据流</label><select id="flow-select" hidden></select><span id="map-provenance">连线来自源码分析</span></div>
          <div class="map-options"><label class="search-box"><span aria-hidden="true" data-icon="search"></span><input type="search" id="search" placeholder="搜索模块、职责或源码…" aria-label="搜索模块或源码"></label><div class="edge-controls"><label id="edge-scope-label">连线范围<select id="edge-scope" aria-label="连线范围"><option value="focus">当前模块</option><option value="all">全部模块</option></select></label><button type="button" id="complexity-toggle" class="complexity-toggle" aria-pressed="true" hidden></button><label class="edge-toggle"><input type="checkbox" id="show-edges" checked> 显示连线</label></div></div>
          <div id="map-viewport" class="map-viewport" tabindex="0" aria-label="交互架构图；单击模块查看详情，双击进入内部"><div id="map-world" class="map-world"></div></div>
          <div class="map-footer"><div class="legend"><span><i class="legend-dot concrete"></i> 模块 / 包</span><span><i class="legend-dot abstract"></i> 含抽象声明</span><span><i class="legend-dot cycle"></i> 含循环依赖</span></div><div class="flow-legend" hidden><span><i class="legend-dot concrete"></i> 已完成</span><span><i class="legend-dot cycle"></i> 未完成</span><span><i class="legend-dot unmarked"></i> 进行中</span></div><span>单击看详情 · 双击进入 · 点击画布外恢复全局 · Ctrl + 滚轮缩放</span></div>
        </section>
        <aside class="detail-panel" id="detail-panel" aria-label="模块详情"></aside>
      </div>
      <section id="design-notes" class="design-notes" aria-label="架构设计说明"></section>
      <section id="cycles-panel" class="cycles-panel" hidden></section>
      <footer class="page-footer"><span>ARCH VIEW / 本地架构工作台</span><span id="document-provenance">结构来自源码，说明来自项目文档</span></footer>
    </main>
  </div>
  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden><header><div><div class="eyebrow" id="drawer-kind">项目说明</div><h2 id="drawer-title">架构说明</h2><p id="drawer-path"></p></div><button id="drawer-close" class="icon-button" aria-label="关闭面板" data-icon="close"></button></header><div id="drawer-content" class="drawer-content"></div></aside>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
